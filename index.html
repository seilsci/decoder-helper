<style>

<script>
const R=[8,9,8,9,8],C=[];
R.forEach((n,r)=>{for(let c=0;c<n;c++)C.push({r,c,x:r%2?c:c+.5})});
const NB=C.map((a,i)=>C.map((b,j)=>j).filter(j=>{const b=C[j],dr=Math.abs(a.r-b.r),dx=Math.abs(a.x-b.x);return j!=i&&((dr==0&&dx==1)||(dr==1&&dx==.5))}));
const T=[];for(let a=0;a<42;a++)for(let b=a+1;b<42;b++)for(let c=b+1;c<42;c++)T.push([a,b,c]);

const L={"ko": {"t": "디코더 훈수", "lang": "한국어", "hint": "훈수", "undo": "되돌리기", "reset": "처음부터", "tip0": "아래 도구(✕ / ! / 빈칸 / 당첨)를 고른 뒤 처음부터 열려 있는 칸을 눌러 표시하세요. 같은 칸을 다시 누르면 해제돼요. 끝나면 훈수!", "tip1": "훈수를 누르면 다음 칸을 알려줘요. 게임에서 눌러 본 뒤 그 칸을 탭해 결과를 입력하세요. 빈칸 때문에 열린 칸에 !가 보이면 그 칸을 탭해 표시하고, 다시 탭하면 해제돼요.", "vn": "당첨 주변의 느낌표가 사라졌어요. 게임에서 그 칸에 느낌표가 아직 남아 있으면 그 칸을 탭하세요. 느낌표가 다시 생기고 확률이 새로 계산돼요.", "b": "빈칸", "h": "느낌표", "f": "당첨", "rec": "추천: {c} (당첨 {p}%)", "done": "3개 모두 찾았어요! 🎉", "bad": "입력이 맞지 않아요. 되돌리기로 확인하세요.", "n": "누른 횟수 {a} · 찾은 당첨 {b}/3 · 칸 숫자는 당첨 확률(%)", "lab": "{r}줄 {c}번째", "calc": "계산 중…"}, "en": {"t": "Decoder Helper", "lang": "English", "hint": "Hint", "undo": "Undo", "reset": "Restart", "tip0": "Pick a tool below (✕ / ! / Blank / Prize), then tap the cells that start open. Tap the same cell again to clear it. Then press Hint.", "tip1": "Press Hint for the next cell. Try it in the game, then tap it here and enter the result. If a cell opened by a blank shows \"!\", tap it to mark it; tap again to unmark.", "vn": "The \"!\" next to the prize disappeared. If it's still showing in the game, tap that cell. The \"!\" will come back and the odds will be recalculated.", "b": "Blank", "h": "Hint (!)", "f": "Prize", "rec": "Try: {c} ({p}% prize)", "done": "All 3 prizes found! 🎉", "bad": "Inputs conflict. Use Undo to check.", "n": "Clicks {a} · Prizes {b}/3 · Numbers = prize chance (%)", "lab": "Row {r}, #{c}", "calc": "Calculating…"}, "ja": {"t": "デコーダー攻略", "lang": "日本語", "hint": "ヒント", "undo": "戻す", "reset": "最初から", "tip0": "下のツール(✕ / ! / 空き / 当たり)を選び、最初から開いているマスをタップ。同じマスをもう一度タップすると解除。終わったらヒントを押してください。", "tip1": "ヒントで次のマスを表示します。ゲームで開けてから、ここで同じマスをタップして結果を入力してください。空きで開いたマスに「!」があれば、タップで表示、もう一度タップで解除できます。", "vn": "当たりの周りの「!」が消えました。ゲームでまだ残っていれば、そのマスをタップしてください。「!」が復活して確率が再計算されます。", "b": "空き", "h": "！", "f": "当たり", "rec": "おすすめ: {c}(当たり {p}%)", "done": "3つ全部見つけました！🎉", "bad": "入力が矛盾しています。「戻す」で確認してください。", "n": "押した回数 {a} · 当たり {b}/3 · 数字は当たり確率(%)", "lab": "{r}行目 {c}番目", "calc": "計算中…"}, "zh": {"t": "解码器助手", "lang": "中文", "hint": "提示", "undo": "撤销", "reset": "重新开始", "tip0": "先选择下方工具（✕ / ! / 空格 / 奖励），再点击开局已打开的格子。再点同一格可取消。完成后按“提示”。", "tip1": "按“提示”获得下一格。先在游戏中点开，再在这里点同一格并输入结果。若因空格而打开的格子显示“!”，点击即可标记，再点一次取消。", "vn": "奖励周围的“!”已消失。如果游戏里仍然显示，请点击该格，“!”会重新出现并重新计算概率。", "b": "空格", "h": "感叹号", "f": "奖励", "rec": "推荐：{c}（中奖率 {p}%）", "done": "3个奖励全部找到！🎉", "bad": "输入前后矛盾，请用“撤销”检查。", "n": "已点 {a} 次 · 已找到 {b}/3 · 数字为中奖概率(%)", "lab": "第{r}行第{c}个", "calc": "计算中…"}, "es": {"t": "Ayuda Decoder", "lang": "Español", "hint": "Pista", "undo": "Deshacer", "reset": "Reiniciar", "tip0": "Elige una herramienta abajo (✕ / ! / Vacía / Premio) y toca las casillas abiertas al inicio. Vuelve a tocar una casilla para quitarla. Luego pulsa Pista.", "tip1": "Pulsa Pista para ver la siguiente casilla. Ábrela en el juego, tócala aquí e indica el resultado. Si una casilla abierta por una vacía muestra \"!\", tócala para marcarla; vuelve a tocarla para quitarla.", "vn": "El \"!\" junto al premio ha desaparecido. Si sigue en el juego, toca esa casilla: el \"!\" volverá y se recalcularán las probabilidades.", "b": "Vacía", "h": "Aviso (!)", "f": "Premio", "rec": "Prueba: {c} ({p}% premio)", "done": "¡Los 3 premios encontrados! 🎉", "bad": "Datos contradictorios. Usa Deshacer para revisar.", "n": "Toques {a} · Premios {b}/3 · Números = prob. de premio (%)", "lab": "Fila {r}, n.º {c}", "calc": "Calculando…"}, "pt": {"t": "Ajuda Decoder", "lang": "Português", "hint": "Dica", "undo": "Desfazer", "reset": "Recomeçar", "tip0": "Escolha uma ferramenta abaixo (✕ / ! / Vazia / Prêmio) e toque nas casas abertas no início. Toque de novo na mesma casa para limpar. Depois toque em Dica.", "tip1": "Toque em Dica para ver a próxima casa. Abra-a no jogo, toque nela aqui e informe o resultado. Se uma casa aberta por uma vazia mostrar \"!\", toque nela para marcar; toque de novo para desmarcar.", "vn": "O \"!\" ao lado do prêmio sumiu. Se ele ainda aparece no jogo, toque nessa casa: o \"!\" volta e as chances são recalculadas.", "b": "Vazia", "h": "Aviso (!)", "f": "Prêmio", "rec": "Tente: {c} ({p}% prêmio)", "done": "Os 3 prêmios foram encontrados! 🎉", "bad": "Dados conflitantes. Use Desfazer para conferir.", "n": "Toques {a} · Prêmios {b}/3 · Números = chance de prêmio (%)", "lab": "Linha {r}, nº {c}", "calc": "Calculando…"}, "de": {"t": "Decoder-Helfer", "lang": "Deutsch", "hint": "Tipp", "undo": "Zurück", "reset": "Neustart", "tip0": "Wähle unten ein Werkzeug (✕ / ! / Leer / Preis) und tippe die anfangs offenen Felder an. Erneut tippen löscht das Feld. Dann auf Tipp drücken.", "tip1": "Tipp zeigt das nächste Feld. Öffne es im Spiel, tippe es hier an und gib das Ergebnis ein. Zeigt ein durch ein leeres Feld geöffnetes Feld „!“, tippe es an, um es zu markieren; erneut tippen hebt es auf.", "vn": "Das „!“ neben dem Preis ist verschwunden. Steht es im Spiel noch, tippe das Feld an: Das „!“ kommt zurück und die Chancen werden neu berechnet.", "b": "Leer", "h": "Hinweis (!)", "f": "Preis", "rec": "Probiere: {c} ({p}% Preis)", "done": "Alle 3 Preise gefunden! 🎉", "bad": "Eingaben widersprechen sich. Mit Zurück prüfen.", "n": "Klicks {a} · Preise {b}/3 · Zahlen = Preis-Chance (%)", "lab": "Reihe {r}, Nr. {c}", "calc": "Berechne…"}, "ru": {"t": "Помощник Decoder", "lang": "Русский", "hint": "Подсказка", "undo": "Отмена", "reset": "Заново", "tip0": "Выберите инструмент внизу (✕ / ! / Пусто / Приз) и нажимайте на клетки, открытые в начале. Повторное нажатие снимает отметку. Затем нажмите «Подсказка».", "tip1": "«Подсказка» покажет следующую клетку. Откройте её в игре, нажмите здесь и введите результат. Если клетка, открытая из-за пустой, показывает «!», нажмите на неё, чтобы отметить; повторное нажатие снимает отметку.", "vn": "«!» рядом с призом исчез. Если в игре он ещё виден, нажмите на эту клетку: «!» вернётся, а шансы пересчитаются.", "b": "Пусто", "h": "«!»", "f": "Приз", "rec": "Попробуйте: {c} (приз {p}%)", "done": "Все 3 приза найдены! 🎉", "bad": "Данные противоречат друг другу. Проверьте через «Отмена».", "n": "Нажатий {a} · Призов {b}/3 · Цифры — шанс приза (%)", "lab": "Ряд {r}, № {c}", "calc": "Считаю…"}, "fr": {"t": "Aide Decoder", "lang": "Français", "hint": "Indice", "undo": "Annuler", "reset": "Recommencer", "tip0": "Choisissez un outil en dessous (✕ / ! / Vide / Prix), puis touchez les cases ouvertes au départ. Touchez à nouveau une case pour l'effacer. Puis appuyez sur Indice.", "tip1": "Indice affiche la prochaine case. Ouvrez-la dans le jeu, touchez-la ici et indiquez le résultat. Si une case ouverte par une case vide affiche « ! », touchez-la pour la marquer ; touchez-la à nouveau pour l'enlever.", "vn": "Le « ! » à côté du prix a disparu. S'il est toujours affiché dans le jeu, touchez cette case : le « ! » reviendra et les probabilités seront recalculées.", "b": "Vide", "h": "Alerte (!)", "f": "Prix", "rec": "Essayez : {c} ({p} % prix)", "done": "Les 3 prix sont trouvés ! 🎉", "bad": "Données contradictoires. Utilisez Annuler pour vérifier.", "n": "Appuis {a} · Prix {b}/3 · Chiffres = probabilité de prix (%)", "lab": "Ligne {r}, n° {c}", "calc": "Calcul…"}};const F=(s,o)=>s.replace(/\{(\w)\}/g,(_,k)=>o[k]);
const brk=s=>s.replace(/([.。])\s*(?=\S)/g,'$1<br>');
function load(){try{const v=localStorage.getItem('dh_lang');if(v&&L[v])return v}catch(e){}return'ko'}
function save(){try{localStorage.setItem('dh_lang',S.lang)}catch(e){}}

let S;
function init(){S={lang:S?S.lang:load(),ov:false,mode:'setup',tool:'x',xs:new Set(),hs:new Set(),bs:new Set(),fs:new Set(),obs:[],n0:0,rec:null,sel:null}}
init();

const found=()=>S.obs.filter(o=>o.k=='f').map(o=>o.i);
function opened(){const s=new Set(S.xs);S.obs.forEach(o=>{s.add(o.i);if(o.k=='b')NB[o.i].forEach(j=>s.add(j))});return s}
function ok(t,o){const hit=t.includes(o.i);if(o.k=='f')return hit;if(hit)return false;
 const near=NB[o.i].some(j=>t.includes(j)&&!o.F.includes(j));return(o.k=='h'||o.h)?near:!near}
function eff(){const tg=new Map();S.obs.forEach(o=>{if(o.k=='t')tg.set(o.r,!tg.get(o.r))});
 return S.obs.filter(o=>o.k!='t').map(o=>o.k=='r'&&tg.get(o)?{...o,h:!o.h}:o)}
function cands(){const E=eff();return T.filter(t=>!t.some(i=>S.xs.has(i))&&E.every(o=>ok(t,o)))}
function lastR(i){let r=null;S.obs.forEach(o=>{if(o.k=='r'&&o.i==i)r=o});return r}
function addObs(i,k){
 S.obs.push({i,k,F:found()});
 if(k=='f'){const F2=found();
  S.obs.filter(o=>o.k=='h'&&NB[o.i].includes(i)).forEach(o=>{
   if(state(o.i)=='h')S.obs.push({i:o.i,k:'r',h:false,F:F2,auto:true})})}}
function undoObs(){
 const o=S.obs.pop();
 if(o&&o.k=='r'&&o.auto){while(S.obs.length&&S.obs[S.obs.length-1].k=='r'&&S.obs[S.obs.length-1].auto)S.obs.pop();S.obs.pop()}}
function analyze(){
 const cf=cands(),N=cf.length,F=found(),op=opened();
 const ni=Array(42).fill(0),ex=Array(42).fill(0),bl=Array(42).fill(0);
 for(const t of cf){const un=t.filter(i=>!F.includes(i));
  for(let x=0;x<42;x++){if(op.has(x))continue;
   if(t.includes(x))ni[x]++;else if(NB[x].some(j=>un.includes(j)))ex[x]++;else bl[x]++}}
 let rec=-1,best=-1;
 if(N&&F.length<3)for(let x=0;x<42;x++){if(op.has(x))continue;
  const sc=2*ni[x]/N+1-(ni[x]**2+ex[x]**2+bl[x]**2)/(N*N);if(sc>best){best=sc;rec=x}}
 return{N,p:ni.map(v=>N?v/N:0),rec}}

const ADJ=new Uint8Array(1764);NB.forEach((l,x)=>l.forEach(a=>ADJ[x*42+a]=1));
const lf=(n,k)=>n&&k?k+.6*Math.log2(n):0;
function best(cf,F,op,k,d,K){
 const N=cf.length,ni=new Int32Array(42),ex=new Int32Array(42),bl=new Int32Array(42);
 for(const t of cf){const u=t.filter(i=>!F[i]);
  for(let x=0;x<42;x++){if(op[x])continue;
   if(t[0]==x||t[1]==x||t[2]==x)ni[x]++;
   else{let n=0;for(const a of u)if(ADJ[x*42+a]){n=1;break}n?ex[x]++:bl[x]++}}}
 const v1=[];
 for(let x=0;x<42;x++)if(!op[x]&&N)v1.push([1+(ni[x]*lf(ni[x],k-1)+ex[x]*lf(ex[x],k)+bl[x]*lf(bl[x],k))/N,x]);
 v1.sort((a,b)=>a[0]-b[0]);
 if(d<=1||!v1.length)return v1.length?v1[0]:[0,-1];
 let bv=1e9,bx=-1;
 for(const[,x]of v1.slice(0,K)){
  const gi=[],gh=[],gb=[];
  for(const t of cf){if(t.includes(x))gi.push(t);else if(t.some(a=>!F[a]&&ADJ[x*42+a]))gh.push(t);else gb.push(t)}
  let v=1;const o1=op.slice();o1[x]=1;
  if(gi.length&&k>1){const F2=F.slice();F2[x]=1;v+=gi.length/N*best(gi,F2,o1,k-1,d-1,K)[0]}
  if(gh.length)v+=gh.length/N*best(gh,F,o1,k,d-1,K)[0];
  if(gb.length){const o2=o1.slice();NB[x].forEach(j=>o2[j]=1);v+=gb.length/N*best(gb,F,o2,k,d-1,K)[0]}
  if(v<bv){bv=v;bx=x}}
 return[bv,bx]}
function deepRec(){
 const cf=cands(),F=new Uint8Array(42),op=new Uint8Array(42);
 found().forEach(i=>F[i]=1);opened().forEach(i=>op[i]=1);
 const k=3-found().length,N=cf.length;if(!N||!k)return -1;
 return(N>3000?best(cf,F,op,k,3,6):N>300?best(cf,F,op,k,4,6):best(cf,F,op,k,5,6))[1]}

function state(i){
 if(S.xs.has(i))return'x';
 if(S.mode=='setup'){
  if(S.fs.has(i))return'f';
  if(S.hs.has(i))return'h';
  if(S.bs.has(i))return'o';
  return'c'}
 const o=S.obs.find(o=>o.i==i);
 if(o){if(o.k=='f')return'f';if(o.k=='h'){let r=null;eff().forEach(x=>{if(x.k=='r'&&x.i==i)r=x});return r&&!r.h?'o':'h'}return'o'}
 return S.obs.some(o=>o.k=='b'&&NB[o.i].includes(i))?'o':'c'}

function vanN(){
 return S.obs.filter(o=>o.k=='h'&&state(o.i)=='o'&&lastR(o.i)).length}
function lastReal(){
 let r=null;S.obs.forEach(o=>{if('bhf'.includes(o.k)&&!o.manual)r=o});return r}

function render(){
 const t=L[S.lang],play=S.mode=='play',A=play?analyze():null;
 document.documentElement.lang=S.lang;
 ti.textContent=t.t;lg.textContent='🌐 '+t.lang;bh.textContent=t.hint;bu.textContent=t.undo;br.textContent=t.reset;
 const pm=A&&A.N?Math.max(...A.p,.01):1;let g='';
 C.forEach((q,i)=>{
  const cx=q.x*40+20,cy=q.r*34.64+23,s=st=state(i),sw=21.4,w=18.6;
  let fill='#ffb300',op=.55,tx='',tc='#fff';
  if(s=='x'){fill='#2a2a2a';op=1;tx='✕';tc='#888'}
  else if(s=='o'){fill='#241f14';op=1}
  else if(s=='h'){fill='#241f14';op=1;tx='!';tc='#ffb300'}
  else if(s=='f'){fill='#ffb300';op=1;tx='★';tc='#1a1300'}
  else if(A&&A.N){op=.18+.82*A.p[i]/pm;tx=Math.round(A.p[i]*100)}
  const pts=[[0,-sw],[w,-sw/2],[w,sw/2],[0,sw],[-w,sw/2],[-w,-sw/2]].map(p=>(cx+p[0]).toFixed(1)+','+(cy+p[1]).toFixed(1)).join(' ');
  g+=`<polygon data-i="${i}" class="${S.rec===i?'rec':''}" points="${pts}" fill="${fill}" fill-opacity="${op}"${S.sel===i?' style="stroke:#fff;stroke-width:3.5"':''}/>`;
  if(tx!=='')g+=`<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="${s=='c'?9:14}" font-weight="700" fill="${tc}" pointer-events="none">${tx}</text>`});
 bd.innerHTML=g;
 let m;
 const lr=play?lastReal():null;
 const nt=(lr&&lr.k=='f'&&vanN()>0)?`<div class="nt">${t.vn}</div>`:'';
 if(!play)m=brk(t.tip0);
 else if(A.N==0)m=brk(t.bad)+nt;
 else if(S.busy)m=t.calc;
 else if(found().length==3)m=t.done;
 else if(S.sel!=null){const q=C[S.sel];
  m=`<b>${F(t.lab,{r:q.r+1,c:q.c+1})}</b> — ?<div class="row"><button data-a="b">${t.b}</button><button data-a="h">${t.h}</button><button class="p" data-a="f">${t.f}</button><button data-a="cancel">✕</button></div>`}
 else if(S.rec!=null&&S.rec>=0){const q=C[S.rec];m=F(t.rec,{c:F(t.lab,{r:q.r+1,c:q.c+1}),p:Math.round(A.p[S.rec]*100)})+nt+(nt?'':`<div class="nt2">${brk(t.tip1.replace(/^[^.。]*[.。]\s*/,''))}</div>`)}
 else m=brk(t.tip1)+nt;
 msg.innerHTML=m;
 cn.textContent=play?F(t.n,{a:S.obs.filter(o=>'bhf'.includes(o.k)&&!o.manual).length-S.n0,b:found().length}):'';
 tl.hidden=play;
 if(!play)tl.innerHTML=['x','h','b','f'].map(k=>`<button data-a="T:${k}"${S.tool==k?' class="p"':''}>${k=='x'?'✕':k=='h'?'!':k=='b'?'○ '+t.b:'★ '+t.f}</button>`).join('');
 ov.hidden=!S.ov;
 if(S.ov)ov.innerHTML='<div class="lgl">'+Object.keys(L).map(k=>`<button data-a="L:${k}"${k==S.lang?' class="p"':''}>${L[k].lang}</button>`).join('')+'</div>';
}

function tap(i){
 if(S.mode=='setup'){
  const tl=S.tool,M={x:S.xs,h:S.hs,b:S.bs,f:S.fs},has=M[tl].has(i);
  if(tl=='f'&&!has&&S.fs.size>=3)return;
  S.xs.delete(i);S.hs.delete(i);S.bs.delete(i);S.fs.delete(i);
  if(!has)M[tl].add(i);
 }else{const s=state(i);
  if((s=='o'||s=='h')&&lastR(i)){S.obs.push({i,k:'t',r:lastR(i)});S.rec=null}
  else if(s=='o'&&!S.obs.some(o=>o.i==i)){S.obs.push({i,k:'h',F:found(),manual:true});S.rec=null}
  else if(s=='h'&&S.obs.some(o=>o.i==i&&o.manual)){
   S.obs=S.obs.filter(o=>!(o.i==i&&(o.manual||o.k=='r'))&&!(o.k=='t'&&o.r&&o.r.i==i));S.rec=null}
  else if(s=='c')S.sel=i}}
function hint(){S.sel=null;S.rec=null;S.busy=true;setTimeout(()=>{S.rec=deepRec();S.busy=false;render()},40)}
function act(a){
 if(a=='lang')S.ov=true;
 else if(a=='ovx')S.ov=false;
 else if(a.startsWith('T:'))S.tool=a.slice(2);
 else if(a.startsWith('L:')){S.lang=a.slice(2);S.ov=false;save()}
 else if(a=='hint'){
  if(S.mode=='setup'){const F0=[...S.fs];S.obs=F0.map(i=>({i,k:'f',F:[]})).concat([...S.hs].map(i=>({i,k:'h',F:F0})),[...S.bs].map(i=>({i,k:'b',F:F0})));S.n0=S.obs.length;S.mode='play'}
  hint()}
 else if(a=='undo'){
  if(S.mode=='play'){if(S.obs.length>S.n0)undoObs();else{S.obs=[];S.mode='setup'}}
  S.rec=null;S.sel=null}
 else if(a=='reset'){const l=S.lang;init();S.lang=l}
 else if(a=='cancel')S.sel=null;
 else if('bhf'.includes(a)&&S.sel!=null){addObs(S.sel,a);hint()}}
document.onclick=e=>{if(S.busy)return;const el=e.target.closest('[data-a],[data-i]');if(!el)return;
 if(el.dataset.i!==undefined){const n=S.obs.length;tap(+el.dataset.i);if(S.mode=='play'&&S.obs.length!=n)hint()}else act(el.dataset.a);render()};
render();
</script></body></html>
