const L={"ko": {"t": "디코더 훈수", "lang": "한국어", "st": "중간부터 시작하면 예측이 덜 정확할 수 있어요. 처음부터 입력하는 걸 추천해요.", "hint": "훈수", "undo": "되돌리기", "reset": "처음부터", "tip0": "아래 도구(✕ / ! / 빈칸 / 당첨)를 고른 뒤<br>처음부터 열려 있는 칸을 눌러 표시하세요. 같은 칸을 다시 누르면 해제돼요. 끝나면 훈수!", "tip1": "훈수를 누르면 다음 칸을 알려줘요. 게임에서 눌러 본 뒤 그 칸을 탭해 결과를 입력하세요. 당첨을 찾은 뒤에도 게임에 !가 남아 있는 칸은 반드시 탭해서 표시하세요. 다시 탭하면 해제돼요.", "vn": "당첨 주변의 느낌표가 사라졌어요. 게임에서 그 칸에 느낌표가 아직 남아 있으면 그 칸을 탭하세요. 느낌표가 다시 생기고 확률이 새로 계산돼요.", "b": "빈칸", "h": "느낌표", "f": "당첨", "rec": "추천: {c} (당첨 {p}%)", "done": "3개 모두 찾았어요! 🎉", "bad": "입력이 맞지 않아요. 되돌리기로 확인하세요.", "badc": "서로 안 맞는 칸(빨간 테두리)", "fbn": "입력이 일부 안 맞아서 가장 가까운 답을 추천해요. 안 맞는 칸(빨간 테두리)", "need4": "이 입력은 당첨이 최소 {n}개 있어야 해서 맞지 않아요(당첨은 총 3개). 느낌표(!) 위치를 다시 확인해 주세요.", "nopl": "이 느낌표(!) 주변에는 당첨이 들어갈 수 있는 칸이 없어요. 느낌표와 주변 ✕·★ 위치를 다시 확인해 주세요.", "fin3": "당첨 3개를 모두 찾았는데 느낌표(!)가 남아 있어요. 느낌표 위치를 다시 확인해 주세요.", "n": "누른 횟수 {a} · 찾은 당첨 {b}/3 · 칸 숫자는 당첨 확률(%)", "lab": "{r}줄 {c}번째", "warn": "⚠️ 당첨을 찾은 뒤에도 남아 있는 !는 반드시 표시하세요. 빠뜨리면 정답 칸이 맨 마지막에 열려요.", "calc": "계산 중…", "exok": "7번째 클릭부터는 완전 탐색으로 계산한 추천이에요.", "exfb": "계산이 너무 오래 걸려서 이번에는 기존 방식으로 추천했어요.", "exbig": "후보가 아직 많아서 이번에는 기존 방식으로 추천했어요."}, "en": {"t": "Decoder Helper", "lang": "English", "st": "Starting mid-game can make the odds less accurate. We recommend starting from the very beginning.", "hint": "Hint", "undo": "Undo", "reset": "Restart", "tip0": "Pick a tool below (✕ / ! / Blank / Prize), then tap the cells that start open. Tap the same cell again to clear it. Then press Hint.", "tip1": "Press Hint for the next cell. Try it in the game, then tap it here and enter the result. If a “!” is still showing in the game after you find a prize, be sure to tap that cell to mark it. Tap again to unmark.", "vn": "The \"!\" next to the prize disappeared. If it's still showing in the game, tap that cell. The \"!\" will come back and the odds will be recalculated.", "b": "Blank", "h": "Hint (!)", "f": "Prize", "rec": "Try: {c} ({p}% prize)", "done": "All 3 prizes found! 🎉", "bad": "Inputs conflict. Use Undo to check.", "badc": "Cells that don't fit (red outline)", "fbn": "Some inputs don't fit, so this is the closest answer. Mismatched cells (red outline)", "need4": "These inputs need at least {n} prizes, but there are only 3. Please double-check the positions of the “!” cells.", "nopl": "No cell next to these “!” can hold a prize. Please double-check the “!” cells and the surrounding ✕ and ★.", "fin3": "All 3 prizes are found, but a “!” is still marked. Please double-check the “!” cells.", "n": "Clicks {a} · Prizes {b}/3 · Numbers = prize chance (%)", "lab": "Row {r}, #{c}", "warn": "⚠️ After finding a prize, be sure to mark every “!” still showing in the game. If you miss one, the correct cell will be opened last.", "calc": "Calculating…", "exok": "Exact search is used from the 7th click.", "exfb": "Calculation took too long, so the usual method was used this time.", "exbig": "Too many candidates remain, so the usual method was used this time."}, "ja": {"t": "デコーダー攻略", "lang": "日本語", "st": "途中から始めると、確率の精度が下がることがあります。最初から入力することをおすすめします。", "hint": "ヒント", "undo": "戻す", "reset": "最初から", "tip0": "下のツール(✕ / ! / 空き / 当たり)を選び、最初から開いているマスをタップ。同じマスをもう一度タップすると解除。終わったらヒントを押してください。", "tip1": "ヒントで次のマスを表示します。ゲームで開けてから、ここで同じマスをタップして結果を入力してください。当たりを見つけた後もゲームに「!」が残っているマスは、必ずタップして表示してください。もう一度タップで解除できます。", "vn": "当たりの周りの「!」が消えました。ゲームでまだ残っていれば、そのマスをタップしてください。「!」が復活して確率が再計算されます。", "b": "空き", "h": "！", "f": "当たり", "rec": "おすすめ: {c}(当たり {p}%)", "done": "3つ全部見つけました！🎉", "bad": "入力が矛盾しています。「戻す」で確認してください。", "n": "押した回数 {a} · 当たり {b}/3 · 数字は当たり確率(%)", "lab": "{r}行目 {c}番目", "warn": "⚠️ 当たりを見つけた後も残っている「!」は必ず印をつけてください。つけ忘れると、正解のマスが一番最後に開きます。", "calc": "計算中…", "badc": "合わないマス(赤い枠)", "fbn": "入力が一部合わないため、最も近い答えをおすすめします。合わないマス(赤い枠)", "need4": "この入力だと当たりが最低{n}つ必要ですが、当たりは全部で3つです。「!」の位置をもう一度確認してください。", "nopl": "この「!」の周りには当たりが入れるマスがありません。「!」と周りの✕・★の位置をもう一度確認してください。", "fin3": "当たり3つをすべて見つけたのに「!」が残っています。「!」の位置をもう一度確認してください。"}, "zh": {"t": "解码器助手", "lang": "中文", "st": "从中途开始，概率可能会不够准确。建议从游戏一开始就输入。", "hint": "提示", "undo": "撤销", "reset": "重新开始", "tip0": "先选择下方工具（✕ / ! / 空格 / 奖励），再点击开局已打开的格子。再点同一格可取消。完成后按“提示”。", "tip1": "按“提示”获得下一格。先在游戏中点开，再在这里点同一格并输入结果。找到奖励后，游戏中仍保留“!”的格子，务必点击标记，再点一次取消。", "vn": "奖励周围的“!”已消失。如果游戏里仍然显示，请点击该格，“!”会重新出现并重新计算概率。", "b": "空格", "h": "感叹号", "f": "奖励", "rec": "推荐：{c}（中奖率 {p}%）", "done": "3个奖励全部找到！🎉", "bad": "输入前后矛盾，请用“撤销”检查。", "n": "已点 {a} 次 · 已找到 {b}/3 · 数字为中奖概率(%)", "lab": "第{r}行第{c}个", "warn": "⚠️ 找到奖励后仍然保留的“!”，请务必标出来。漏标的话，正确的格子会被排到最后才打开。", "calc": "计算中…", "badc": "不匹配的格子(红框)", "fbn": "部分输入不匹配，已推荐最接近的答案。不匹配的格子(红框)", "need4": "按这样的输入至少需要{n}个奖励，但奖励一共只有3个。请重新确认“!”的位置。", "nopl": "这些“!”周围没有可以放奖励的格子。请重新确认“!”以及周围的✕和★。", "fin3": "3个奖励都已找到，但仍有“!”标记。请重新确认“!”的位置。"}, "zh-TW": {"t": "解碼器助手", "lang": "繁體中文", "st": "從中途開始，機率可能會不夠準確。建議從遊戲一開始就輸入。", "hint": "提示", "undo": "復原", "reset": "重新開始", "tip0": "先選擇下方工具（✕ / ! / 空格 / 獎勵），再點擊開局已打開的格子。再點同一格可取消。完成後按「提示」。", "tip1": "按「提示」取得下一格。先在遊戲中點開，再在這裡點同一格並輸入結果。找到獎勵後，遊戲中仍保留「!」的格子，務必點擊標記，再點一次取消。", "vn": "獎勵周圍的「!」已消失。如果遊戲裡仍然顯示，請點擊該格，「!」會重新出現並重新計算機率。", "b": "空格", "h": "驚嘆號", "f": "獎勵", "rec": "推薦：{c}（中獎率 {p}%）", "done": "3個獎勵全部找到！🎉", "bad": "輸入前後矛盾，請用「復原」檢查。", "badc": "不相符的格子(紅框)", "fbn": "部分輸入不相符，已推薦最接近的答案。不相符的格子(紅框)", "need4": "依這樣的輸入至少需要{n}個獎勵，但獎勵一共只有3個。請重新確認「!」的位置。", "nopl": "這些「!」周圍沒有可以放獎勵的格子。請重新確認「!」以及周圍的✕和★。", "fin3": "3個獎勵都已找到，但仍有「!」標記。請重新確認「!」的位置。", "n": "已點 {a} 次 · 已找到 {b}/3 · 數字為中獎機率(%)", "lab": "第{r}行第{c}個", "warn": "⚠️ 找到獎勵後仍然保留的「!」，請務必標出來。漏標的話，正確的格子會被排到最後才打開。", "calc": "計算中…"}, "es": {"t": "Ayuda Decoder", "lang": "Español", "st": "Si empiezas a mitad de partida, las probabilidades pueden ser menos precisas. Te recomendamos empezar desde el principio.", "hint": "Pista", "undo": "Deshacer", "reset": "Reiniciar", "tip0": "Elige una herramienta abajo (✕ / ! / Vacía / Premio) y toca las casillas abiertas al inicio. Vuelve a tocar una casilla para quitarla. Luego pulsa Pista.", "tip1": "Pulsa Pista para ver la siguiente casilla. Ábrela en el juego, tócala aquí e indica el resultado. Si tras encontrar un premio una casilla sigue mostrando «!» en el juego, tócala sin falta para marcarla; vuelve a tocarla para quitarla.", "vn": "El \"!\" junto al premio ha desaparecido. Si sigue en el juego, toca esa casilla: el \"!\" volverá y se recalcularán las probabilidades.", "b": "Vacía", "h": "Aviso (!)", "f": "Premio", "rec": "Prueba: {c} ({p}% premio)", "done": "¡Los 3 premios encontrados! 🎉", "bad": "Datos contradictorios. Usa Deshacer para revisar.", "n": "Toques {a} · Premios {b}/3 · Números = prob. de premio (%)", "lab": "Fila {r}, n.º {c}", "warn": "⚠️ Tras encontrar un premio, marca sin falta todos los «!» que sigan en el juego. Si te dejas alguno, la casilla correcta se abrirá la última.", "calc": "Calculando…", "badc": "Casillas que no encajan (borde rojo)", "fbn": "Algunos datos no encajan; esta es la respuesta más cercana. Casillas en conflicto (borde rojo)", "need4": "Con estos datos harían falta al menos {n} premios, pero solo hay 3. Revisa la posición de los «!».", "nopl": "Alrededor de estos «!» no hay ninguna casilla donde pueda haber un premio. Revisa los «!» y las ✕ y ★ cercanas.", "fin3": "Ya están los 3 premios, pero queda algún «!» marcado. Revisa la posición de los «!»."}, "pt": {"t": "Ajuda Decoder", "lang": "Português", "st": "Começar no meio da partida pode deixar as chances menos precisas. Recomendamos começar desde o início.", "hint": "Dica", "undo": "Desfazer", "reset": "Recomeçar", "tip0": "Escolha uma ferramenta abaixo (✕ / ! / Vazia / Prêmio) e toque nas casas abertas no início. Toque de novo na mesma casa para limpar. Depois toque em Dica.", "tip1": "Toque em Dica para ver a próxima casa. Abra-a no jogo, toque nela aqui e informe o resultado. Se, depois de achar um prêmio, uma casa continuar mostrando «!» no jogo, toque nela sem falta para marcar; toque de novo para desmarcar.", "vn": "O \"!\" ao lado do prêmio sumiu. Se ele ainda aparece no jogo, toque nessa casa: o \"!\" volta e as chances são recalculadas.", "b": "Vazia", "h": "Aviso (!)", "f": "Prêmio", "rec": "Tente: {c} ({p}% prêmio)", "done": "Os 3 prêmios foram encontrados! 🎉", "bad": "Dados conflitantes. Use Desfazer para conferir.", "n": "Toques {a} · Prêmios {b}/3 · Números = chance de prêmio (%)", "lab": "Linha {r}, nº {c}", "warn": "⚠️ Depois de achar um prêmio, marque sem falta todos os «!» que continuarem no jogo. Se esquecer algum, a casa correta será aberta por último.", "calc": "Calculando…", "badc": "Casas que não combinam (borda vermelha)", "fbn": "Alguns dados não combinam; esta é a resposta mais próxima. Casas em conflito (borda vermelha)", "need4": "Com esses dados seriam necessários pelo menos {n} prêmios, mas só existem 3. Confira a posição dos «!».", "nopl": "Ao redor desses «!» não há nenhuma casa onde possa haver um prêmio. Confira os «!» e os ✕ e ★ próximos.", "fin3": "Os 3 prêmios já foram encontrados, mas ainda há «!» marcados. Confira a posição dos «!»."}, "de": {"t": "Decoder-Helfer", "lang": "Deutsch", "st": "Wenn du mitten im Spiel einsteigst, können die Chancen ungenauer sein. Wir empfehlen, von Anfang an zu starten.", "hint": "Tipp", "undo": "Zurück", "reset": "Neustart", "tip0": "Wähle unten ein Werkzeug (✕ / ! / Leer / Preis) und tippe die anfangs offenen Felder an. Erneut tippen löscht das Feld. Dann auf Tipp drücken.", "tip1": "Tipp zeigt das nächste Feld. Öffne es im Spiel, tippe es hier an und gib das Ergebnis ein. Zeigt ein Feld im Spiel nach dem Fund eines Preises noch ein „!“, tippe es unbedingt an, um es zu markieren; erneut tippen hebt es auf.", "vn": "Das „!“ neben dem Preis ist verschwunden. Steht es im Spiel noch, tippe das Feld an: Das „!“ kommt zurück und die Chancen werden neu berechnet.", "b": "Leer", "h": "Hinweis (!)", "f": "Preis", "rec": "Probiere: {c} ({p}% Preis)", "done": "Alle 3 Preise gefunden! 🎉", "bad": "Eingaben widersprechen sich. Mit Zurück prüfen.", "n": "Klicks {a} · Preise {b}/3 · Zahlen = Preis-Chance (%)", "lab": "Reihe {r}, Nr. {c}", "warn": "⚠️ Markiere nach dem Fund eines Preises unbedingt jedes „!“, das im Spiel noch steht. Wenn du eines auslässt, wird das richtige Feld ganz zuletzt geöffnet.", "calc": "Berechne…", "badc": "Felder, die nicht passen (roter Rand)", "fbn": "Einige Eingaben passen nicht; dies ist die nächstliegende Antwort. Widersprüchliche Felder (roter Rand)", "need4": "Mit diesen Eingaben wären mindestens {n} Preise nötig, es gibt aber nur 3. Bitte prüfe die Positionen der „!“.", "nopl": "Neben diesen „!“ gibt es kein Feld, auf dem ein Preis liegen kann. Bitte prüfe die „!“ sowie die ✕ und ★ in der Nähe.", "fin3": "Alle 3 Preise sind gefunden, aber es ist noch ein „!“ markiert. Bitte prüfe die Positionen der „!“."}, "ru": {"t": "Помощник Decoder", "lang": "Русский", "st": "Если начать с середины игры, шансы могут считаться менее точно. Рекомендуем начинать с самого начала.", "hint": "Подсказка", "undo": "Отмена", "reset": "Заново", "tip0": "Выберите инструмент внизу (✕ / ! / Пусто / Приз) и нажимайте на клетки, открытые в начале. Повторное нажатие снимает отметку. Затем нажмите «Подсказка».", "tip1": "«Подсказка» покажет следующую клетку. Откройте её в игре, нажмите здесь и введите результат. Если после находки приза в игре на клетке всё ещё есть «!», обязательно нажмите на неё, чтобы отметить; повторное нажатие снимает отметку.", "vn": "«!» рядом с призом исчез. Если в игре он ещё виден, нажмите на эту клетку: «!» вернётся, а шансы пересчитаются.", "b": "Пусто", "h": "«!»", "f": "Приз", "rec": "Попробуйте: {c} (приз {p}%)", "done": "Все 3 приза найдены! 🎉", "bad": "Данные противоречат друг другу. Проверьте через «Отмена».", "n": "Нажатий {a} · Призов {b}/3 · Цифры — шанс приза (%)", "lab": "Ряд {r}, № {c}", "warn": "⚠️ После находки приза обязательно отмечайте все «!», которые остались в игре. Если пропустить хотя бы один, правильная клетка откроется самой последней.", "calc": "Считаю…", "badc": "Клетки, которые не подходят (красная рамка)", "fbn": "Часть данных не сходится, поэтому показан ближайший ответ. Несовпадающие клетки (красная рамка)", "need4": "По этим данным призов должно быть минимум {n}, а их всего 3. Проверьте расположение «!».", "nopl": "Рядом с этими «!» нет клетки, где мог бы быть приз. Проверьте «!» и ближайшие ✕ и ★.", "fin3": "Все 3 приза найдены, но «!» всё ещё отмечены. Проверьте расположение «!»."}, "fr": {"t": "Aide Decoder", "lang": "Français", "st": "Commencer en cours de partie peut rendre les probabilités moins précises. Nous vous recommandons de commencer dès le début.", "hint": "Indice", "undo": "Annuler", "reset": "Recommencer", "tip0": "Choisissez un outil en dessous (✕ / ! / Vide / Prix), puis touchez les cases ouvertes au départ. Touchez à nouveau une case pour l'effacer. Puis appuyez sur Indice.", "tip1": "Indice affiche la prochaine case. Ouvrez-la dans le jeu, touchez-la ici et indiquez le résultat. Si, après avoir trouvé un prix, une case affiche encore « ! » dans le jeu, touchez-la impérativement pour la marquer ; touchez-la à nouveau pour l'enlever.", "vn": "Le « ! » à côté du prix a disparu. S'il est toujours affiché dans le jeu, touchez cette case : le « ! » reviendra et les probabilités seront recalculées.", "b": "Vide", "h": "Alerte (!)", "f": "Prix", "rec": "Essayez : {c} ({p} % prix)", "done": "Les 3 prix sont trouvés ! 🎉", "bad": "Données contradictoires. Utilisez Annuler pour vérifier.", "n": "Appuis {a} · Prix {b}/3 · Chiffres = probabilité de prix (%)", "lab": "Ligne {r}, n° {c}", "warn": "⚠️ Après avoir trouvé un prix, marquez impérativement tous les « ! » qui restent dans le jeu. Si vous en oubliez, la bonne case sera ouverte en dernier.", "calc": "Calcul…", "badc": "Cases qui ne concordent pas (contour rouge)", "fbn": "Certaines données ne concordent pas, voici la réponse la plus proche. Cases en conflit (contour rouge)", "need4": "Avec ces données, il faudrait au moins {n} prix, alors qu'il n'y en a que 3. Vérifiez la position des « ! ».", "nopl": "Autour de ces « ! », aucune case ne peut contenir un prix. Vérifiez les « ! » ainsi que les ✕ et ★ voisins.", "fin3": "Les 3 prix sont trouvés, mais des « ! » restent marqués. Vérifiez la position des « ! »."}, "it": {"t": "Aiuto Decoder", "lang": "Italiano", "st": "Se inizi a partita in corso, le probabilità possono essere meno precise. Ti consigliamo di iniziare dall'inizio.", "hint": "Suggerimento", "undo": "Annulla", "reset": "Ricomincia", "tip0": "Scegli uno strumento qui sotto (✕ / ! / Vuota / Premio) e tocca le caselle aperte all'inizio. Tocca di nuovo una casella per rimuoverla. Poi premi Suggerimento.", "tip1": "Premi Suggerimento per vedere la casella successiva. Aprila nel gioco, toccala qui e inserisci il risultato. Se dopo aver trovato un premio una casella mostra ancora “!” nel gioco, toccala sempre per segnarla; toccala di nuovo per rimuoverla.", "vn": "Il “!” accanto al premio è sparito. Se nel gioco è ancora visibile, tocca quella casella: il “!” tornerà e le probabilità verranno ricalcolate.", "b": "Vuota", "h": "Avviso (!)", "f": "Premio", "rec": "Prova: {c} ({p}% premio)", "done": "Tutti e 3 i premi trovati! 🎉", "bad": "Dati in contraddizione. Usa Annulla per controllare.", "badc": "Caselle che non coincidono (bordo rosso)", "fbn": "Alcuni dati non coincidono, quindi questa è la risposta più vicina. Caselle in conflitto (bordo rosso)", "need4": "Con questi dati servirebbero almeno {n} premi, ma ce ne sono solo 3. Controlla la posizione dei “!”.", "nopl": "Intorno a questi “!” non c'è nessuna casella in cui possa esserci un premio. Controlla i “!” e le ✕ e ★ vicine.", "fin3": "Tutti e 3 i premi sono stati trovati, ma c'è ancora un “!” segnato. Controlla la posizione dei “!”.", "n": "Tocchi {a} · Premi {b}/3 · Numeri = probabilità di premio (%)", "lab": "Riga {r}, n. {c}", "warn": "⚠️ Dopo aver trovato un premio, segna sempre tutti i “!” che restano nel gioco. Se ne salti uno, la casella giusta verrà aperta per ultima.", "calc": "Calcolo…"}, "ar": {"t": "مساعد ديكودر", "lang": "العربية", "st": "البدء من منتصف اللعبة قد يجعل النسب أقل دقة. ننصحك بالبدء من البداية.", "hint": "تلميح", "undo": "تراجع", "reset": "من جديد", "tip0": "اختر أداة من الأسفل (✕ / ! / فارغة / جائزة) ثم اضغط على المربعات المفتوحة في البداية. اضغط على المربع نفسه مرة أخرى لإزالته. ثم اضغط تلميح.", "tip1": "اضغط تلميح لمعرفة المربع التالي. افتحه في اللعبة ثم اضغط عليه هنا وأدخل النتيجة. إذا بقيت «!» ظاهرة على مربع في اللعبة بعد العثور على جائزة، فاضغط عليه لتعليمه حتمًا، واضغط مرة أخرى لإزالة العلامة.", "vn": "اختفت «!» المجاورة للجائزة. إذا كانت لا تزال ظاهرة في اللعبة، اضغط على ذلك المربع، وستعود «!» ويُعاد حساب النسب.", "b": "فارغة", "h": "تنبيه (!)", "f": "جائزة", "rec": "جرّب: {c} (احتمال الجائزة {p}%)", "done": "تم العثور على الجوائز الثلاث! 🎉", "bad": "المدخلات متعارضة. استخدم تراجع للتحقق.", "badc": "مربعات لا تتطابق (إطار أحمر)", "fbn": "بعض المدخلات لا تتطابق، لذا هذه أقرب إجابة. المربعات المتعارضة (إطار أحمر)", "need4": "هذه المدخلات تتطلب {n} جوائز على الأقل، لكن العدد الكلي 3 فقط. تحقق من مواضع «!».", "nopl": "لا يوجد حول هذه «!» مربع يمكن أن توجد فيه جائزة. تحقق من «!» ومن ✕ و★ المجاورة.", "fin3": "تم العثور على الجوائز الثلاث، لكن ما زالت هناك «!» معلَّمة. تحقق من مواضع «!».", "n": "الضغطات {a} · الجوائز {b}/3 · الأرقام = احتمال الجائزة (%)", "lab": "الصف {r}، رقم {c}", "warn": "⚠️ بعد العثور على جائزة، علِّم حتمًا كل «!» لا تزال ظاهرة في اللعبة. إذا فاتتك واحدة، سيُفتح المربع الصحيح أخيرًا.", "calc": "جارٍ الحساب…"}, "hi": {"t": "डिकोडर सहायक", "lang": "हिन्दी", "st": "खेल के बीच से शुरू करने पर संभावनाएँ कम सटीक हो सकती हैं। हम शुरुआत से दर्ज करने की सलाह देते हैं।", "hint": "संकेत", "undo": "पूर्ववत", "reset": "फिर से शुरू", "tip0": "नीचे से कोई टूल चुनें (✕ / ! / खाली / इनाम), फिर शुरुआत में खुले खानों पर टैप करें। उसी खाने पर दोबारा टैप करने से निशान हट जाता है। फिर संकेत दबाएँ।", "tip1": "अगला खाना जानने के लिए संकेत दबाएँ। उसे खेल में खोलें, फिर यहाँ उस पर टैप करके नतीजा दर्ज करें। इनाम मिलने के बाद भी अगर खेल में किसी खाने पर “!” बचा दिखे, तो उस पर ज़रूर टैप करके निशान लगाएँ; दोबारा टैप करने पर निशान हट जाएगा।", "vn": "इनाम के पास का “!” गायब हो गया। अगर वह खेल में अब भी दिख रहा है, तो उस खाने पर टैप करें। “!” वापस आ जाएगा और संभावनाएँ दोबारा निकाली जाएँगी।", "b": "खाली", "h": "चेतावनी (!)", "f": "इनाम", "rec": "आज़माएँ: {c} (इनाम {p}%)", "done": "तीनों इनाम मिल गए! 🎉", "bad": "दर्ज की गई जानकारी आपस में मेल नहीं खाती। जाँचने के लिए पूर्ववत दबाएँ।", "badc": "मेल न खाने वाले खाने (लाल किनारा)", "fbn": "कुछ जानकारी मेल नहीं खाती, इसलिए यह सबसे नज़दीकी जवाब है। मेल न खाने वाले खाने (लाल किनारा)", "need4": "इस जानकारी के लिए कम से कम {n} इनाम चाहिए, जबकि कुल इनाम सिर्फ़ 3 हैं। कृपया “!” की जगहें दोबारा जाँचें।", "nopl": "इन “!” के आसपास कोई ऐसा खाना नहीं है जहाँ इनाम हो सके। कृपया “!” और आसपास के ✕ व ★ दोबारा जाँचें।", "fin3": "तीनों इनाम मिल चुके हैं, फिर भी “!” का निशान बचा है। कृपया “!” की जगहें दोबारा जाँचें।", "n": "टैप {a} · इनाम {b}/3 · संख्याएँ = इनाम की संभावना (%)", "lab": "पंक्ति {r}, क्रमांक {c}", "warn": "⚠️ इनाम मिलने के बाद भी खेल में बचे हर “!” पर ज़रूर निशान लगाएँ। एक भी छूटा तो सही खाना सबसे आख़िर में खुलेगा।", "calc": "गणना हो रही है…"}, "id": {"t": "Pembantu Decoder", "lang": "Bahasa Indonesia", "st": "Mulai di tengah permainan bisa membuat peluang kurang akurat. Kami sarankan mulai dari awal.", "hint": "Petunjuk", "undo": "Urungkan", "reset": "Mulai ulang", "tip0": "Pilih alat di bawah (✕ / ! / Kosong / Hadiah), lalu ketuk kotak yang terbuka sejak awal. Ketuk kotak yang sama lagi untuk menghapus. Lalu tekan Petunjuk.", "tip1": "Tekan Petunjuk untuk melihat kotak berikutnya. Buka di permainan, ketuk di sini, lalu masukkan hasilnya. Jika setelah menemukan hadiah sebuah kotak masih menampilkan “!” di permainan, wajib ketuk untuk menandai; ketuk lagi untuk melepas.", "vn": "“!” di samping hadiah menghilang. Jika masih terlihat di permainan, ketuk kotak itu: “!” akan muncul lagi dan peluang dihitung ulang.", "b": "Kosong", "h": "Tanda (!)", "f": "Hadiah", "rec": "Coba: {c} (hadiah {p}%)", "done": "Ketiga hadiah ditemukan! 🎉", "bad": "Data saling bertentangan. Gunakan Urungkan untuk memeriksa.", "badc": "Kotak yang tidak cocok (garis merah)", "fbn": "Sebagian data tidak cocok, jadi ini jawaban terdekat. Kotak yang bertentangan (garis merah)", "need4": "Dengan data ini dibutuhkan minimal {n} hadiah, padahal hanya ada 3. Periksa lagi posisi “!”.", "nopl": "Di sekitar “!” ini tidak ada kotak yang bisa berisi hadiah. Periksa lagi “!” serta ✕ dan ★ di sekitarnya.", "fin3": "Ketiga hadiah sudah ditemukan, tetapi masih ada “!” yang ditandai. Periksa lagi posisi “!”.", "n": "Ketukan {a} · Hadiah {b}/3 · Angka = peluang hadiah (%)", "lab": "Baris {r}, ke-{c}", "warn": "⚠️ Setelah menemukan hadiah, wajib tandai semua “!” yang masih ada di permainan. Jika ada yang terlewat, kotak yang benar akan dibuka paling akhir.", "calc": "Menghitung…"}, "tr": {"t": "Decoder Yardımcısı", "lang": "Türkçe", "st": "Oyunun ortasından başlamak olasılıkları daha az doğru yapabilir. En baştan başlamanı öneririz.", "hint": "İpucu", "undo": "Geri al", "reset": "Yeniden başla", "tip0": "Aşağıdan bir araç seç (✕ / ! / Boş / Ödül), ardından başta açık olan karelere dokun. Aynı kareye tekrar dokunursan işaret kalkar. Sonra İpucu'na bas.", "tip1": "Sıradaki kareyi görmek için İpucu'na bas. Oyunda aç, burada ona dokun ve sonucu gir. Ödül bulduktan sonra oyunda hâlâ “!” görünen bir kare varsa mutlaka dokunarak işaretle; tekrar dokunursan kalkar.", "vn": "Ödülün yanındaki “!” kayboldu. Oyunda hâlâ görünüyorsa o kareye dokun: “!” geri gelir ve olasılıklar yeniden hesaplanır.", "b": "Boş", "h": "Uyarı (!)", "f": "Ödül", "rec": "Dene: {c} (ödül %{p})", "done": "3 ödülün hepsi bulundu! 🎉", "bad": "Girdiler birbiriyle çelişiyor. Kontrol için Geri al'ı kullan.", "badc": "Uyuşmayan kareler (kırmızı çerçeve)", "fbn": "Bazı girdiler uyuşmuyor, bu yüzden en yakın cevap gösteriliyor. Çelişen kareler (kırmızı çerçeve)", "need4": "Bu girdiler için en az {n} ödül gerekir ama toplam yalnızca 3 ödül var. “!” konumlarını tekrar kontrol et.", "nopl": "Bu “ const brk=s=>s.replace(/([.。।])\s*(?=\S)/g,'$1<br>');
function load(){try{const v=localStorage.getItem('dh_lang');if(v&&L[v])return v}catch(e){}return'ko'}

let S;
function init(){S={lang:S?S.lang:load(),ov:false,mode:'setup',tool:'x',xs:new Set(),hs:new Set(),bs:new Set(),os:new Set(),fs:new Set(),obs:[],n0:0,rec:null,sel:null,ex:null}}
init();

const found=()=>S.obs.filter(o=>o.k=='f').map(o=>o.i);
const clicks=()=>S.obs.filter(o=>'bhf'.includes(o.k)&&!o.manual).length-S.n0;
function opened(){const s=new Set([...S.xs,...S.os]);S.obs.forEach(o=>{s.add(o.i);if(o.k=='b')NB[o.i].forEach(j=>s.add(j))});return s}
function ok(t,o){const hit=t.includes(o.i);if(o.k=='f')return hit;if(hit)return false;
 const near=NB[o.i].some(j=>t.includes(j)&&!o.F.includes(j));return(o.k=='h'||o.h)?near:!near}
function eff(){const tg=new Map();S.obs.forEach(o=>{if(o.k=='t')tg.set(o.r,!tg.get(o.r))});
 return S.obs.filter(o=>o.k!='t').map(o=>o.k=='r'&&tg.get(o)?{...o,h:!o.h}:o)}
function cands(E){E=E||eff();return T.filter(t=>!t.some(i=>S.xs.has(i)||S.os.has(i))&&E.every(o=>ok(t,o)))}
function conflict(){
 const E=eff();let bestV=null;
 for(const t of T){if(t.some(i=>S.xs.has(i)||S.os.has(i)))continue;
  const v=E.filter(o=>!ok(t,o));
  if(!bestV||v.length<bestV.length){bestV=v;if(!v.length)break}}
 return bestV?[...new Set(bestV.map(o=>o.i))]:[]}
function lastR(i){let r=null;S.obs.forEach(o=>{if(o.k=='r'&&o.i==i)r=o});return r}
function addObs(i,k){
 S.obs.push({i,k,F:found()});
 if(k=='f'){const F2=found();
  S.obs.filter(o=>o.k=='h'&&NB[o.i].includes(i)).forEach(o=>{
   if(state(o.i)=='h')S.obs.push({i:o.i,k:'r',h:false,F:F2,auto:true})})}}
function undoObs(){
 const o=S.obs.pop();
 if(o&&o.k=='r'&&o.auto){while(S.obs.length&&S.obs[S.obs.length-1].k=='r'&&S.obs[S.obs.length-1].auto)S.obs.pop();S.obs.pop()}}
function analyze(){
 const cf=cands(),N=cf.length,F=found(),op=opened();
 const ni=Array(42).fill(0),ex=Array(42).fill(0),bl=Array(42).fill(0);
 for(const t of cf){const un=t.filter(i=>!F.includes(i));
  for(let x=0;x<42;x++){if(op.has(x))continue;
   if(t.includes(x))ni[x]++;else if(NB[x].some(j=>un.includes(j)))ex[x]++;else bl[x]++}}
 let rec=-1,best=-1;
 if(N&&F.length<3)for(let x=0;x<42;x++){if(op.has(x))continue;
  const sc=2*ni[x]/N+1-(ni[x]**2+ex[x]**2+bl[x]**2)/(N*N);if(sc>best){best=sc;rec=x}}
 return{N,p:ni.map(v=>N?v/N:0),rec}}

const ADJ=new Uint8Array(1764);NB.forEach((l,x)=>l.forEach(a=>ADJ[x*42+a]=1));
const lf=(n,k)=>n&&k?k+.6*Math.log2(n):0;
function best(cf,F,op,k,d,K){
 const N=cf.length,ni=new Int32Array(42),ex=new Int32Array(42),bl=new Int32Array(42);
 for(const t of cf){const u=t.filter(i=>!F[i]);
  for(let x=0;x<42;x++){if(op[x])continue;
   if(t[0]==x||t[1]==x||t[2]==x)ni[x]++;
   else{let n=0;for(const a of u)if(ADJ[x*42+a]){n=1;break}n?ex[x]++:bl[x]++}}}
 const v1=[];
 for(let x=0;x<42;x++)if(!op[x]&&N)v1.push([1+(ni[x]*lf(ni[x],k-1)+ex[x]*lf(ex[x],k)+bl[x]*lf(bl[x],k))/N,x]);
 v1.sort((a,b)=>a[0]-b[0]);
 if(d<=1||!v1.length)return v1.length?v1[0]:[0,-1];
 let bv=1e9,bx=-1;
 for(const[,x]of v1.slice(0,K)){
  const gi=[],gh=[],gb=[];
  for(const t of cf){if(t.includes(x))gi.push(t);else if(t.some(a=>!F[a]&&ADJ[x*42+a]))gh.push(t);else gb.push(t)}
  let v=1;const o1=op.slice();o1[x]=1;
  if(gi.length&&k>1){const F2=F.slice();F2[x]=1;v+=gi.length/N*best(gi,F2,o1,k-1,d-1,K)[0]}
  if(gh.length)v+=gh.length/N*best(gh,F,o1,k,d-1,K)[0];
  if(gb.length){const o2=o1.slice();NB[x].forEach(j=>o2[j]=1);v+=gb.length/N*best(gb,F,o2,k,d-1,K)[0]}
  if(v<bv){bv=v;bx=x}}
 return[bv,bx]}
function appChoice(cf,F,op,k){const N=cf.length;return(N>3000?best(cf,F,op,k,3,6):N>300?best(cf,F,op,k,4,6):best(cf,F,op,k,5,6))[1]}
function deepRec(){
 const cf=cands(),F=new Uint8Array(42),op=new Uint8Array(42);
 found().forEach(i=>F[i]=1);opened().forEach(i=>op[i]=1);
 const k=3-found().length,N=cf.length;if(!N||!k)return -1;
 return appChoice(cf,F,op,k)}

const XM=(()=>{try{return /[?&]x=1(&|$)/.test(location.search)}catch(e){return false}})();
/* ---- 완전 탐색 (주소 끝에 ?x=1 을 붙였을 때만, 7번째 클릭부터) ----
   앞 6번은 기존 추천을 그대로 쓰고, 그 뒤에는 근사 없이 끝까지 계산해 기대 클릭 수가 가장 적은 칸을 고른다.
   후보가 너무 많거나 계산이 오래 걸리면 그 단계만 기존 추천으로 대신한다. */
const EX_FROM=6;        /* 이 횟수만큼 누른 뒤(= 7번째 클릭)부터 */
const EX_MAXN=36;       /* 후보가 이 개수 이하일 때만 시도 */
const EX_BUD=2000000;   /* 계산 호출 한도 */
const EX_MS=8000;       /* 계산 시간 한도(ms) */
let exCalls=0,exT0=0;const exMemo=new Map();
const exCode=t=>t[0]*1764+t[1]*42+t[2];
const exKey=(cf,F,op,H)=>cf.map(exCode).join(',')+'|'+F.join('')+'|'+op.join('')+'|'+H.join(',');
function exSig(t,x,F,H){
 const unf=t.filter(a=>!F[a]);
 if(t.includes(x)){let s='f';for(const h of H)s+=unf.some(a=>a!==x&&ADJ[h*42+a])?'1':'0';return s}
 return unf.some(a=>ADJ[x*42+a])?'h':'b'}
function exSplit(cf,x,F,H){const m=new Map();for(const t of cf){const s=exSig(t,x,F,H);let g=m.get(s);if(!g){g=[];m.set(s,g)}g.push(t)}return m}
function exNext(s,x,F,op,H){
 const op2=op.slice();op2[x]=1;
 if(s[0]=='f'){const F2=F.slice();F2[x]=1;return[F2,op2,H.filter((_,i)=>s[1+i]=='1')]}
 if(s=='h')return[F,op2,H.concat([x])];
 NB[x].forEach(j=>op2[j]=1);return[F,op2,H]}
function exCheck(){if(++exCalls>EX_BUD||((exCalls&255)==0&&Date.now()-exT0>EX_MS))throw new Error('budget')}
function exV(cf,F,op,H,k){
 if(k==0)return 0;if(cf.length==1)return k;
 exCheck();
 const kk=exKey(cf,F,op,H);if(exMemo.has(kk))return exMemo.get(kk);
 let bs=1e9;
 for(let x=0;x<42;x++){if(op[x])continue;
  const v=exVal(x,cf,F,op,H,k,bs);if(v<bs)bs=v}
 exMemo.set(kk,bs);return bs}
function exVal(x,cf,F,op,H,k,lim){
 const m=exSplit(cf,x,F,H);
 if(m.size==1&&[...m.keys()][0][0]!='f')return 1e9;
 let v=1;
 for(const[s,g]of m){const[F2,op2,H2]=exNext(s,x,F,op,H);v+=g.length/cf.length*exV(g,F2,op2,H2,s[0]=='f'?k-1:k);if(v>=lim)return v}
 return v}
/* 반환: 칸 번호(0~41) / -1 해당 없음 / -2 시간·계산량 초과 / -3 후보가 너무 많음 */
function exRec(){
 const cf=cands(),N=cf.length,k=3-found().length;
 if(N<2||k<1)return -1;
 if(N>EX_MAXN)return -3;
 const F=new Uint8Array(42),op=new Uint8Array(42);
 found().forEach(i=>F[i]=1);opened().forEach(i=>op[i]=1);
 const H=C.map((_,i)=>i).filter(i=>state(i)=='h');
 exMemo.clear();exCalls=0;exT0=Date.now();
 try{
  let bs=1e9,bx=-1;
  for(let x=0;x<42;x++){if(op[x])continue;const v=exVal(x,cf,F,op,H,k,bs);if(v<bs){bs=v;bx=x}}
  if(bx<0)return -1;
  const xa=appChoice(cf,F,op,k); /* 동점이면 기존 추천 유지 */
  if(xa>=0&&!op[xa]&&exVal(xa,cf,F,op,H,k,1e9)<=bs+1e-9)bx=xa;
  return bx
 }catch(e){if(e.message!=='budget')throw e;return -2}
 finally{exMemo.clear()}}

function state(i){
 if(S.xs.has(i))return'x';
 if(S.mode=='setup'){
  if(S.fs.has(i))return'f';
  if(S.hs.has(i))return'h';
  if(S.bs.has(i))return'o';
  return'c'}
 const o=S.obs.find(o=>o.i==i);
 if(o){if(o.k=='f')return'f';if(o.k=='h'){let r=null;eff().forEach(x=>{if(x.k=='r'&&x.i==i)r=x});return r&&!r.h?'o':'h'}return'o'}
 return S.os.has(i)||S.obs.some(o=>o.k=='b'&&NB[o.i].includes(i))?'o':'c'}

function vanN(){
 return S.obs.filter(o=>o.k=='h'&&state(o.i)=='o'&&lastR(o.i)).length}
function lastReal(){
 let r=null;S.obs.forEach(o=>{if('bhf'.includes(o.k)&&!o.manual)r=o});return r}

function render(){
 const t=L[S.lang],play=S.mode=='play',A=play?analyze():null;
 document.documentElement.lang=S.lang;
 ti.textContent=t.t;lg.textContent='🌐 '+t.lang;bh.textContent=t.hint;bu.textContent=t.undo;br.textContent=t.reset;
 const pm=A&&A.N?Math.max(...A.p,.01):1;let g='';const CF=(play&&S.imp)?S.imp.cells:(A&&!A.N&&!S.sure)?conflict():[];
 C.forEach((q,i)=>{
  const cx=q.x*40+20,cy=q.r*34.64+23,s=st=state(i),sw=21.4,w=18.6;
  let fill='#ffb300',op=.55,tx='',tc='#fff';
  if(s=='x'){fill='#2a2a2a';op=1;tx='✕';tc='#888'}
  else if(s=='o'){fill='#241f14';op=1}
  else if(s=='h'){fill='#241f14';op=1;tx='!';tc='#ffb300'}
  else if(s=='f'){fill='#ffb300';op=1;tx='★';tc='#1a1300'}
  else if(A&&A.N){op=.18+.82*A.p[i]/pm;tx=Math.round(A.p[i]*100)}
  const pts=[[0,-sw],[w,-sw/2],[w,sw/2],[0,sw],[-w,sw/2],[-w,-sw/2]].map(p=>(cx+p[0]).toFixed(1)+','+(cy+p[1]).toFixed(1)).join(' ');
  g+=`<polygon data-i="${i}" class="${S.rec===i?'rec':''}" points="${pts}" fill="${fill}" fill-opacity="${op}"${S.sel===i?' style="stroke:#fff;stroke-width:3.5"':CF.includes(i)?' style="stroke:#ef4444;stroke-width:3.5"':''}/>`;
  if(tx!=='')g+=`<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="${s=='c'?9:14}" font-weight="700" fill="${tc}" pointer-events="none">${tx}</text>`});
 bd.innerHTML=g;
 let m;
 const lr=play?lastReal():null;
 const nt=(lr&&lr.k=='f'&&vanN()>0)?`<div class="nt">${t.vn}</div>`:'';
 if(!play)m=brk(t.tip0)+`<div class="st">${(t.st||L.en.st).replace(/([.。।])\s*/,'$1<br>')}</div>`+W();
 else if(S.busy)m=t.calc;
 else if(S.imp)m=F(t[{many:'need4',noplace:'nopl',fin3:'fin3'}[S.imp.k]]||L.en[{many:'need4',noplace:'nopl',fin3:'fin3'}[S.imp.k]],{n:S.imp.n})+(CF.length?`<div class="nt2">${CF.map(i=>LB(t,i)).join(' · ')}</div>`:'');
 else if(found().length==3)m=t.done;
 else if(S.sel!=null){const q=C[S.sel];
  m=`<b>${LB(t,S.sel)}</b> — ?<div class="row"><button data-a="b">${t.b}</button><button data-a="h">${t.h}</button><button class="p" data-a="f">${t.f}</button><button data-a="cancel">✕</button></div>`}
 else if(A.N==0&&!S.fb)m=brk(t.bad)+(CF.length?`<div class="nt2">${t.badc||L.en.badc}: ${CF.map(i=>LB(t,i)).join(' · ')}</div>`:'')+nt;
 else if(S.rec!=null&&S.rec>=0){const q=C[S.rec];m=F(t.rec,{c:LB(t,S.rec),p:S.fb?Math.round(S.fbp*100):Math.round(A.p[S.rec]*100)})+(S.fb&&!S.sure?`<div class="nt">${t.fbn||L.en.fbn}${CF.length?': '+CF.map(i=>LB(t,i)).join(' · '):''}</div>`:'')+exNote(t)+nt+(nt?'':`<div class="nt2">${brk(t.tip1.replace(/^[^.。।]*[.。।]\s*/,''))}</div>`)+W()}
 else m=brk(t.tip1)+nt+W();
 msg.innerHTML=m;msg.dir=cn.dir=S.lang=='ar'?'rtl':'ltr';
 cn.textContent=play?F(t.n,{a:S.obs.filter(o=>'bhf'.includes(o.k)&&!o.manual).length-S.n0,b:found().length}):'';
 tl.hidden=play;
 if(!play)tl.innerHTML=['x','h','b','f'].map(k=>`<button data-a="T:${k}"${S.tool==k?' class="p"':''}>${k=='x'?'✕':k=='h'?'!':k=='b'?'○ '+t.b:'★ '+t.f}</button>`).join('');
 ov.hidden=!S.ov;
 if(S.ov){const used=new Set(LG.flat()),gs=LG.concat([Object.keys(L).filter(k=>!used.has(k))]).map(g=>g.filter(k=>L[k])).filter(g=>g.length);
  ov.innerHTML='<div class="lgl">'+gs.map(g=>'<div class="lgg">'+g.map(k=>`<button data-a="L:${k}"${k==S.lang?' class="p"':''}>${L[k].lang}</button>`).join('')+'</div>').join('')+'</div>'}
}

function tap(i){
 if(S.mode=='play'&&S.fb&&i===S.rec){S.sel=i;return}
 if(S.mode=='setup'){
  const tl=S.tool,M={x:S.xs,h:S.hs,b:S.bs,f:S.fs},has=M[tl].has(i);
  if(tl=='f'&&!has&&S.fs.size>=3)return;
  S.xs.delete(i);S.hs.delete(i);S.bs.delete(i);S.fs.delete(i);
  if(!has)M[tl].add(i);
 }else{const s=state(i);
  if((s=='o'||s=='h')&&lastR(i)){S.obs.push({i,k:'t',r:lastR(i)});S.rec=null}
  else if(s=='o'&&!S.obs.some(o=>o.i==i)){S.obs.push({i,k:'h',F:found(),manual:true});S.rec=null}
  else if(s=='h'&&S.obs.some(o=>o.i==i&&o.manual)){
   S.obs=S.obs.filter(o=>!(o.i==i&&(o.manual||o.k=='r'))&&!(o.k=='t'&&o.r&&o.r.i==i));S.rec=null}
  else if(s=='c')S.sel=i}}
function visH(){return[...new Set(S.obs.filter(o=>o.k=='h'&&state(o.i)=='h').map(o=>o.i))]}
function impossible(){
 const F=found(),E=eff().filter(o=>o.k=='h'||(o.k=='r'&&o.h));
 const mk=new Set(S.obs.filter(o=>o.k=='b'||o.k=='h').map(o=>o.i));
 const need=E.filter(o=>!NB[o.i].some(j=>F.includes(j)&&!o.F.includes(j)));
 const opts=o=>NB[o.i].filter(j=>!S.xs.has(j)&&!S.os.has(j)&&!F.includes(j)&&!mk.has(j)&&!o.F.includes(j));
 const nop=need.filter(o=>!opts(o).length);
 if(nop.length)return{k:'noplace',cells:[...new Set(nop.map(o=>o.i))]};
 const ch=new Set();
 const dfs=lim=>{const o=need.find(o=>!opts(o).some(j=>ch.has(j)));if(!o)return true;if(!lim)return false;
  for(const j of opts(o)){ch.add(j);const r=dfs(lim-1);ch.delete(j);if(r)return true}return false};
 let m=0;while(m<7&&!dfs(m))m++;
 return F.length+m>3?{k:'many',n:F.length+m,cells:visH()}:null}
function fallback(){
 const F=found();if(F.length>=3)return null;
 const cl=(S.cl||[]).filter(i=>!S.xs.has(i)&&!S.obs.some(o=>o.i==i));
 if(cl.length&&cl.length<=3-F.length)return{i:cl[0],p:1,sure:true};
 const E=eff();let bv=1e9,cnt=new Map(),n=0;
 for(const t of T){if(t.some(i=>S.xs.has(i)||S.os.has(i))||!F.every(i=>t.includes(i)))continue;
  const v=E.filter(o=>!ok(t,o)).length;
  if(v>bv)continue;
  if(v<bv){bv=v;cnt=new Map();n=0}
  n++;t.forEach(i=>{if(!F.includes(i))cnt.set(i,(cnt.get(i)||0)+1)})}
 if(!n)return null;
 let r=-1,m=0,pc=0;cnt.forEach((c,i)=>{const sc=c+((S.cl||[]).includes(i)?.5:0);if(sc>m){m=sc;r=i;pc=c}});
 return r<0?null:{i:r,p:pc/n}}
function hint(){S.sel=null;S.rec=null;S.fb=false;S.sure=false;S.imp=null;S.ex=null;S.busy=true;setTimeout(()=>{
 try{S.rec=deepRec();
  if(found().length>=3){if(!cands().length)S.imp={k:'fin3',cells:visH()}}
  else if(S.rec<0&&!cands().length){S.imp=impossible();const f=S.imp?null:fallback();if(f){S.rec=f.i;S.fb=true;S.fbp=f.p;S.sure=!!f.sure}}
  else if(XM&&S.rec>=0&&clicks()>=EX_FROM){const r=exRec();if(r>=0){S.rec=r;S.ex='ok'}else if(r==-2)S.ex='fb';else if(r==-3)S.ex='big'}}
 catch(e){console.error(e);S.rec=-1}
 S.busy=false;render()},40)}
function act(a){
 if(a=='lang')S.ov=true;
 else if(a=='ovx')S.ov=false;
 else if(a.startsWith('T:'))S.tool=a.slice(2);
 else if(a.startsWith('L:')){S.lang=a.slice(2);S.ov=false;save()}
 else if(a=='hint'){
  if(S.mode=='setup'){S.cl=C.map((_,i)=>i).filter(i=>state(i)=='c');const F0=[...S.fs];S.os=new Set(S.bs);S.obs=F0.map(i=>({i,k:'f',F:[]})).concat([...S.hs].map(i=>({i,k:'h',F:F0})));S.n0=S.obs.length;S.mode='play'}
  hint()}
 else if(a=='undo'){
  if(S.mode=='play'){if(S.obs.length>S.n0)undoObs();else{S.obs=[];S.mode='setup'}}
  S.rec=null;S.sel=null;S.imp=null;S.ex=null}
 else if(a=='reset'){const l=S.lang;init();S.lang=l}
 else if(a=='cancel')S.sel=null;
 else if('bhf'.includes(a)&&S.sel!=null){addObs(S.sel,a);hint()}}
document.onclick=e=>{if(S.busy)return;const el=e.target.closest('[data-a],[data-i]');if(!el)return;
 if(el.dataset.i!==undefined){const n=S.obs.length;tap(+el.dataset.i);if(S.mode=='play'&&S.obs.length!=n)hint()}else act(el.dataset.a);render()};
render();
</script></body></html>
